# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/interactive_session.git
          branch: main
          sparse_checkout:
            - ${{ inputs.service.name }}
            - tools/oras
      - name: Create Inputs
        run: |
          set -x
          # Write PW variables
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          # Encase values between quotes
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          # Write input form variables and ensure the pw agent is in the PATH
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_models="${{ inputs.service.models }}"
          service_serve_only_requested="${{ inputs.service.serve_only_requested }}"
          service_context_length="${{ inputs.service.context_length }}"
          service_keep_alive="${{ inputs.service.keep_alive }}"
          service_preload="${{ inputs.service.preload }}"
          service_models_dir="${{ inputs.service.models_dir }}"
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          service_ollama_version="${{ inputs.service.ollama_version }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG}"
          EOF
          # Remove empty variables
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh # remove var=""
          # Add export= to all lines
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          # Fail loud when the checkout did not materialize the service scripts
          # (e.g. the runtime does not exist on the checked-out branch); a failing
          # cat mid-step would otherwise be silently ignored
          if [ ! -f "${{ inputs.service.name }}/controller-v4.sh" ]; then
            echo "::error title=Error::${{ inputs.service.name }}/controller-v4.sh not found in the checkout of branch main"
            exit 1
          fi
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat ${{ inputs.service.name }}/controller-v4.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          if [ ! -f "${{ inputs.service.name }}/start-template-v4.sh" ]; then
            echo "::error title=Error::${{ inputs.service.name }}/start-template-v4.sh not found in the checkout of branch main"
            exit 1
          fi
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat ${{ inputs.service.name }}/start-template-v4.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/interactive_session@main
        early-cancel: any-job-failed
        with:
          $yaml: workflow/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        run: |
          endpoint_name="${{ inputs.service.name }}-${PW_RUN_SLUG}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          until pw endpoints list | grep -qw "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
          touch ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          sleep 2
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      cluster:
        type: group
        label: Compute Cluster Settings
        items:
          resource:
            type: compute-clusters
            label: Service host
            include-workspace: false
            tooltip: Resource to host the service
          scheduler:
            type: boolean
            default: false
            label: Schedule Job?
            hidden: ${{ inputs.cluster.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Yes → Job is submitted to the scheduler using sbatch, qsub, etc
              No  → Job is executed in the controller or login node instead
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM Enabled? Yes, unless the slurm section is hidden and ignored
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.cluster.resource }}
                tooltip: Select a partition from the drop down menu.
              time:
                label: Walltime
                type: string
                default: '01:00:00'
                tooltip: '--time= SLURM directive to set the maximum wall-clock time limit for the job'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                default: 0
                hidden: ${{ inputs.cluster.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                optional: true
                tooltip: |
                  Add extra SLURM directives, one per line, using the #SBATCH prefix. For example:
                  #SBATCH --exclusive
                  #SBATCH --nodelist=<node-name>
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled? Yes, unless the pbs section is hidden and ignored
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                tooltip: |
                  Add extra PBS directives, one per line, using the #PBS prefix. For example:
                  #PBS -l mem=16gb
                  #PBS -l ngpus=1

      service:
        type: group
        label: Ollama Settings
        items:
          name:
            label: Runtime
            type: dropdown
            default: ollama-gguf
            tooltip: |
              Native installs the Ollama release tarball on the host (needs glibc >= 2.28
              and zstd). The Singularity container runs the official ollama/ollama image
              instead and works on hosts where the native binary cannot run.
            options:
              - label: Native (Ollama tarball)
                value: ollama-gguf
              - label: Singularity container
                value: ollama-gguf-container
          models:
            label: Models to serve
            type: string
            default: hf.co/bartowski/gemma-2-2b-it-abliterated-GGUF:Q4_K_M
            tooltip: |
              Space or comma separated list of models to pull and serve. Accepts Ollama
              library names (qwen3:4b) or Hugging Face GGUF references
              (hf.co/<owner>/<repo>:<quant>). Ensure the host has enough disk and memory
              for the quantization you pick — a Q4_K_M of a 31B model is about 19 GB.
              Examples:
              hf.co/mradermacher/gemma-4-31B-it-heretic-GGUF:Q4_K_M
              hf.co/mradermacher/gemma-4-31B-it-The-DECKARD-HERETIC-UNCENSORED-Thinking-GGUF:Q4_K_M
          serve_only_requested:
            label: Serve only the requested models
            type: boolean
            default: true
            hidden: ${{ inputs.service.name == 'ollama-gguf' }}
            ignore: ${{ .hidden }}
            tooltip: |
              Expose only the models listed above instead of every model cached in the
              model directory. Available with the Singularity container runtime, which
              mounts a filtered view of the model manifests into the container.
          context_length:
            label: Context length (tokens)
            type: number
            default: 8192
            tooltip: Context window used for loaded models (OLLAMA_CONTEXT_LENGTH)
          keep_alive:
            label: Keep models loaded
            type: string
            default: 5m
            optional: true
            tooltip: How long a model stays loaded in memory after its last request (OLLAMA_KEEP_ALIVE), e.g. 5m, 1h, or -1 to keep it loaded forever
          preload:
            label: Preload models
            type: boolean
            default: true
            tooltip: Load the requested models into memory as soon as the server starts, so the first request does not wait for the model to load. Combine with Keep models loaded = -1 to keep them in memory permanently.
          models_dir:
            label: Model Directory
            type: string
            default: ${HOME}/pw/software/ollama-gguf/models
            tooltip: Directory where model weights are stored (OLLAMA_MODELS). If new models must be pulled and this directory is not writable, the run falls back to ${HOME}/pw/software/ollama-gguf/models.
          parent_install_dir:
            label: Parent Install Directory
            type: string
            hidden: true
            default: ${HOME}/pw/software
            tooltip: Ollama and the model weights are installed under this directory. Ensure it has sufficient space!
          ollama_version:
            label: Ollama version
            type: string
            hidden: true
            default: v0.32.5
