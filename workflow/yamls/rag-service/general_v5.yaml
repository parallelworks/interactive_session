# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
#
# RAG Service -- a standalone retrieval service for agents. Watches a directory
# of documents, indexes them into an embedded LanceDB dataset (vectors + BM25
# full-text), and exposes a search HTTP API (hybrid / dense / fts) through a
# platform endpoint. It serves retrieval only: no LLM, no chat proxy.
permissions:
  - '*'

jobs:
  preprocessing:
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/interactive_session.git
          branch: rag-service
          sparse_checkout:
            - ${{ inputs.service.name }}
            - tools/oras
      - name: Create Inputs
        run: |
          set -x
          env | grep '^PW_' | grep -v 'PW_API_KEY' > inputs.sh
          sed -i 's/=\(.*\)/="\1"/' inputs.sh
          cat <<'EOF' >> inputs.sh
          PATH=$HOME/pw:$PATH
          service_name="${{ inputs.service.name }}"
          service_docs_dir="${{ inputs.service.docs_dir }}"
          service_embedding_model_id="${{ inputs.service.embedding_model_id }}"
          service_chunk_chars="${{ inputs.service.chunk_chars }}"
          service_chunk_overlap="${{ inputs.service.chunk_overlap }}"
          service_default_top_k="${{ inputs.service.default_top_k }}"
          service_table_name="${{ inputs.service.table_name }}"
          service_parent_install_dir="${{ inputs.service.parent_install_dir }}"
          pw_endpoints_args="--name ${{ inputs.service.name }}-${PW_RUN_SLUG} --description rag-service:${{ inputs.cluster.resource.name }}"
          EOF
          sed -i '/=\s*$\|=undefined\s*$/d' inputs.sh
          sed -i '/=""/d' inputs.sh
          sed -i 's/^/export /' inputs.sh
      - name: Controller Preprocessing
        run: |
          set -x
          # This script prepares the target host and always runs in the controller node
          cp inputs.sh controller-${PW_JOB_ID}.sh
          cat ${{ inputs.service.name }}/controller-v4.sh >> controller-${PW_JOB_ID}.sh
          bash controller-${PW_JOB_ID}.sh
      - name: Create Service Script
        run: |
          rm -f HOSTNAME SESSION_PORT job.ended job.started
          # This script starts the service
          cp inputs.sh start-service-${PW_JOB_ID}.sh

          # Write code common to all services
          cat <<'EOF' >> start-service-${PW_JOB_ID}.sh

          cleanup() {
              trap - EXIT INT TERM HUP QUIT USR1 USR2 PIPE
              echo "::notice::Cleaning up..."
              if [ -f cancel.sh ]; then
                  mv cancel.sh cancel.sh.submitted
                  echo "echo Cleanup script was already executed" > cancel.sh
                  bash cancel.sh.submitted
              fi
              kill -- -$$
          }

          trap cleanup EXIT INT TERM HUP QUIT USR1 USR2 PIPE

          echo "::notice::Starting service"
          EOF
          cat ${{ inputs.service.name }}/start-template-v4.sh >> ./start-service-${PW_JOB_ID}.sh
          echo "SCRIPT_PATH=${PWD}/start-service-${PW_JOB_ID}.sh" | tee -a $OUTPUTS
          echo "SKIP_CLEANUP_PATH=${PWD}/SKIP_CLEANUP" | tee -a $OUTPUTS

  session_runner:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Session Runner
        uses: github/parallelworks/interactive_session@main
        early-cancel: any-job-failed
        with:
          $yaml: workflow/script_submitter/v3.6/general.yaml
          resource: ${{ inputs.cluster.resource }}
          shebang: '#!/bin/bash'
          use_existing_script: true
          script_path: ${{ needs.preprocessing.outputs.SCRIPT_PATH }}
          define_cleanup_script: true
          cleanup_script_path: ./cancel.sh
          scheduler: ${{ inputs.cluster.scheduler }}
          use_scheduler_agent: false
          submit_and_exit: false
          skip_cleanups_file: ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          slurm:
            is_enabled: ${{ inputs.cluster.slurm.is_enabled }}
            partition: ${{ inputs.cluster.slurm.partition }}
            scheduler_directives: ${{ inputs.cluster.slurm.scheduler_directives }}
            time: ${{ inputs.cluster.slurm.time }}
            gpus: ${{ inputs.cluster.slurm.gpus }}
          pbs:
            is_enabled: ${{ inputs.cluster.pbs.is_enabled }}
            scheduler_directives: ${{ inputs.cluster.pbs.scheduler_directives }}
      - name: Cancel Wait for Endpoint
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - wait_for_endpoint
      - name: Exit Workflow with Error
        run: |
          echo "::error title=Error::Session runner failed before the endpoint came online"
          exit 1

  wait_for_endpoint:
    needs:
      - preprocessing
    ssh:
      remoteHost: ${{ inputs.cluster.resource.ip }}
    steps:
      - name: Wait for endpoint
        early-cancel: any-job-failed
        run: |
          endpoint_name="${{ inputs.service.name }}-${PW_RUN_SLUG}"
          echo "::notice::Waiting for endpoint ${endpoint_name} to come online"
          until pw endpoints list | grep -qw "${endpoint_name}"; do
            echo "$(date) Endpoint ${endpoint_name} not found yet; retrying in 10 seconds"
            sleep 10
          done
          echo "::notice::Endpoint ${endpoint_name} is online"
          touch ${{ needs.preprocessing.outputs.SKIP_CLEANUP_PATH }}
          sleep 2
      - name: Cancel Script Submitter
        uses: parallelworks/cancel-jobs
        with:
          jobs:
            - session_runner

'on':
  execute:
    inputs:
      cluster:
        type: group
        label: Cluster
        items:
          resource:
            type: compute-clusters
            label: Cluster
            include-workspace: false
            tooltip: >-
              The cluster to run the retrieval service on. The docs directory
              must exist on this cluster's shared filesystem.
          scheduler:
            type: boolean
            default: false
            label: Schedule Job?
            hidden: ${{ inputs.cluster.resource.schedulerType == '' }}
            ignore: ${{ .hidden }}
            tooltip: >-
              Off: run on the login node. On: submit to the scheduler; the
              embedding model is served from a pre-populated cache so compute
              nodes need no internet.
          slurm:
            type: group
            label: SLURM Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'slurm' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is SLURM enabled?
              partition:
                type: slurm-partitions
                label: SLURM partition
                optional: true
                resource: ${{ inputs.cluster.resource }}
              time:
                label: Walltime
                type: string
                default: '08:00:00'
              gpus:
                label: Number of GPUs
                type: number
                optional: true
                min: 0
                default: 0
                hidden: ${{ inputs.cluster.resource.ip != 'dn-slurm-1.parallel.works' }}
                ignore: ${{ .hidden }}
                tooltip: '--gpus= SLURM directive to set the number of GPUs allocated for the job'
              scheduler_directives:
                type: editor
                optional: true
                tooltip: Extra #SBATCH directives, one per line.
          pbs:
            type: group
            label: PBS Directives
            hidden: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            ignore: ${{ inputs.cluster.resource.schedulerType != 'pbs' || inputs.cluster.scheduler == false }}
            items:
              is_enabled:
                type: boolean
                hidden: true
                default: true
                label: Is PBS enabled?
              scheduler_directives:
                label: Scheduler Directives
                type: editor
                tooltip: Extra #PBS directives, one per line.
      service:
        type: group
        label: Settings
        items:
          name:
            type: string
            hidden: true
            default: rag-service
          docs_dir:
            label: Documents directory
            type: string
            tooltip: >-
              Absolute path (on the cluster's shared filesystem) of the
              directory of documents to index and watch. Supported types:
              .pdf, .md, .txt, .csv, .log.
          embedding_model_id:
            label: Embedding model
            type: dropdown
            default: BAAI/bge-small-en-v1.5
            options:
              - label: Fast (default MiniLM) — 384 dim, ~80MB, no prefixes
                value: sentence-transformers/all-MiniLM-L6-v2
              - label: Balanced (recommended) — bge-small, 384 dim, ~130MB, retrieval-tuned
                value: BAAI/bge-small-en-v1.5
              - label: Higher quality (larger corpora) — bge-base, 768 dim, ~440MB, ~3x compute
                value: BAAI/bge-base-en-v1.5
              - label: Multilingual corpora — multilingual-e5-small, 384 dim, ~470MB
                value: intfloat/multilingual-e5-small
            tooltip: >-
              Model used to embed chunks and queries (downloaded once on the
              login node, cached for offline compute nodes). All options are
              ungated Apache-2.0/MIT HF repos; query/passage prefix conventions
              per model family are applied automatically.
          chunk_chars:
            label: Chunk size (characters)
            type: number
            default: 700
            min: 100
          chunk_overlap:
            label: Chunk overlap (characters)
            type: number
            default: 80
            min: 0
          default_top_k:
            label: Default top_k
            type: number
            default: 8
            min: 1
            tooltip: How many results /search returns when top_k is not given.
          table_name:
            label: Table name
            type: string
            default: activate_rag
            tooltip: >-
              LanceDB table to index into. Use different tables to serve
              several corpora from the same cluster.
          parent_install_dir:
            label: Parent install directory
            type: string
            optional: true
            tooltip: >-
              Where the service keeps its dependency container
              (containers/rag-service.sif) and the embedding model cache
              (models/). Must be on the shared filesystem. Defaults to
              ${HOME}/pw/software when left empty.
